<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyPatientHUB - Sign In</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <section class="welcome-section">

            <div class="welcome-content">

                <h1>Welcome to MyPatientHUB!</h1>

                <p>
                    We provide smart healthcare services in your hands.
                </p>

            </div>

        </section>


        <section class="login-card">

            <h2>Sign in to MyPatientHUB</h2>


            <div class="social-login">

                <button type="button" class="social-btn facebook-btn">
                    f
                </button>

                <button type="button" class="social-btn google-btn">
                    G
                </button>

            </div>


            <form id="loginForm" class="login-form">

                <input
                    type="text"
                    id="email"
                    placeholder="Email or Phone number"
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Please enter your password"
                >


                <button type="submit" class="sign-in-btn">
                    SIGN IN
                </button>


                <div class="login-options">

                    <a href="#" id="forgotPassword">
                        Forgot password?
                    </a>

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>Remember me</span>

                    </label>

                </div>


                <div class="or-divider">
                    <span>or</span>
                </div>


                <button
                    type="button"
                    id="signUpButton"
                    class="sign-up-btn"
                >
                    SIGN UP
                </button>

            </form>

        </section>


        <footer class="login-footer">

            <a href="#">Google Play Store APP</a>
            <a href="#">App Store APP</a>
            <a href="#">About MyPatientHUB</a>
            <a href="#">About Us</a>
            <a href="#">Our Blog</a>

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
