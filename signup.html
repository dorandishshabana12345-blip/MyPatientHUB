<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MyPatientHUB - Sign Up</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="login-page">

        <section class="welcome-section">

            <div class="welcome-content">

                <h1>Welcome to MyPatientHUB!</h1>

                <p>
                    We provide smart healthcare services in your hands.
                </p>

            </div>

        </section>


        <section class="login-card signup-card">

            <h2>Create your MyPatientHUB account</h2>


            <div class="social-login">

                <button
                    type="button"
                    class="social-btn facebook-btn"
                >
                    f
                </button>

                <button
                    type="button"
                    class="social-btn google-btn"
                >
                    G
                </button>

            </div>


            <form id="signupForm" class="login-form">

                <input
                    type="text"
                    id="fullName"
                    placeholder="Full name"
                    required
                >

                <input
                    type="text"
                    id="signupEmail"
                    placeholder="Email or Phone number"
                    required
                >

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create password"
                    required
                >

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >


                <button
                    type="submit"
                    class="sign-up-btn"
                >
                    SIGN UP
                </button>


                <div class="or-divider">
                    <span>or</span>
                </div>


                <button
                    type="button"
                    id="backToLogin"
                    class="sign-in-btn"
                >
                    SIGN IN
                </button>

            </form>

        </section>


        <footer class="login-footer">

            <a href="#">Google Play Store APP</a>
            <a href="#">App Store APP</a>
            <a href="#">About MyPatientHUB</a>
            <a href="#">About Us</a>
            <a href="#">Our Blog</a>

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
